<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人类审核机器局 | oldpei.site</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .verification-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 500px;
      margin: 2rem auto;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin: 1.5rem 0;
    }
    .grid-item {
      aspect-ratio: 1;
      background-size: cover;
      background-position: center;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      filter: blur(2px) brightness(0.9);
      transition: filter 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .grid-item.selected {
      border-color: var(--accent-blue);
      filter: blur(0px) brightness(1.1);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.5);
    }
    /* 鼠标悬停时略微清晰 */
    .grid-item:hover {
      filter: blur(1px) brightness(0.95);
    }
    .btn-verify {
      width: 100%;
    }
    .fail-counter {
      text-align: center;
      color: var(--text-secondary);
      margin: 1rem 0;
      font-family: var(--font-mono);
    }
    .refresh-hint {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
<span class="logo">离谱发明实验室</span>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="../index.html" class="nav-link">← 返回实验室</a>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">🤖 人类审核机器局</h1>
    <p class="page-subtitle">请证明你不是机器人。</p>

    <div class="verification-box">
      <div id="messageBox"></div>
      <p style="margin-bottom: 0.5rem; font-weight: 600;">
        请选出所有包含 <span style="color: var(--accent-blue);">红绿灯</span> 的图片：
      </p>
      <div class="grid-container" id="imageGrid"></div>
      <div class="refresh-hint">
        看不清？<a href="#" id="refreshLink">换一批图片</a>
      </div>
      <button class="btn btn-verify" id="verifyBtn">验证</button>
      <div class="fail-counter">剩余尝试次数：<span id="attemptsLeft">3</span></div>
    </div>
  </div>

  <script src="../assets/ads.js"></script>
  <script src="../assets/utils.js"></script>
  <script src="../assets/ad-banner.js"></script>

  <script>
    // 汉堡菜单
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => {
        navLinks.classList.toggle('open');
      });
      navLinks.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('open');
        });
      });
    }

    let attempts = 3;
    const attemptsLeftEl = document.getElementById('attemptsLeft');
    const messageBox = document.getElementById('messageBox');
    const imageGrid = document.getElementById('imageGrid');
    const refreshLink = document.getElementById('refreshLink');

    // 生成随机图片网格（使用 picsum 占位图，模拟真实物体）
    function generateGrid() {
      imageGrid.innerHTML = '';
      // 使用不同的随机参数确保图片不同
      for (let i = 0; i < 9; i++) {
        const div = document.createElement('div');
        div.className = 'grid-item';
        // 使用 picsum 提供随机图片，并添加随机参数防止缓存
        const imgId = Math.floor(Math.random() * 200) + 1;
        div.style.backgroundImage = `url(https://picsum.photos/id/${imgId}/200/200)`;
        div.addEventListener('click', () => {
          div.classList.toggle('selected');
        });
        imageGrid.appendChild(div);
      }
    }

    function showMessage(text, type) {
      messageBox.innerHTML = `<div class="message message-${type}">${text}</div>`;
    }

    // 验证按钮逻辑
    document.getElementById('verifyBtn').addEventListener('click', () => {
      const selected = document.querySelectorAll('.grid-item.selected');
      if (selected.length === 0) {
        showMessage('请至少选择一个图片。', 'error');
        return;
      }

      attempts--;
      attemptsLeftEl.textContent = attempts;

      if (attempts > 0) {
        showMessage('验证失败，请重试。提示：仔细观察图片中的红绿灯。', 'error');
        // 清除选择并刷新图片
        document.querySelectorAll('.grid-item.selected').forEach(item => item.classList.remove('selected'));
        generateGrid();
      } else {
        // 三次失败，显示AI判定和隐藏资源
        messageBox.innerHTML = `
          <div class="message message-success">
            🤖 系统判定您可能是高级AI，已为您开启机器人专用资源通道。
          </div>
        `;
        // 显示随机广告
        if (typeof AD_LIST !== 'undefined' && AD_LIST.length > 0) {
          const randomAd = AD_LIST[Math.floor(Math.random() * AD_LIST.length)];
          const adDiv = document.createElement('div');
          adDiv.className = 'message';
          adDiv.style.cssText = 'background-color: rgba(88,166,255,0.1); border-color: var(--accent-blue); margin-top: 1rem;';
          adDiv.innerHTML = `
            <strong>🎁 隐藏资源：</strong> ${randomAd.title}<br>
            <button class="btn btn-sm" style="margin-top: 0.5rem;" id="copyAdBtn">复制口令</button>
          `;
          messageBox.appendChild(adDiv);
          document.getElementById('copyAdBtn').addEventListener('click', () => {
            copyToClipboard(randomAd.code, (success) => {
              alert(success ? '已复制，打开任推邦查看资源' : '复制失败');
            });
          });
        }
        // 禁用所有交互
        document.getElementById('verifyBtn').disabled = true;
        document.getElementById('verifyBtn').textContent = '已锁定';
        document.querySelectorAll('.grid-item').forEach(item => {
          item.style.pointerEvents = 'none';
          item.style.filter = 'blur(1px)';
        });
        refreshLink.style.pointerEvents = 'none';
        refreshLink.style.color = 'var(--text-secondary)';
      }
    });

    // 刷新图片
    refreshLink.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.grid-item.selected').forEach(item => item.classList.remove('selected'));
      generateGrid();
    });

    // 初始生成
    generateGrid();
  </script>
</body>
</html>
