<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码绝不同款注册局 | oldpei.site</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .rule-hint {
      background-color: rgba(88,166,255,0.05);
      border-left: 3px solid var(--accent-blue);
      padding: 0.8rem 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      border-radius: var(--radius);
    }
    .tab-container {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-family: var(--font-sans);
      font-size: 1rem;
    }
    .tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
    }
    .form-panel {
      display: none;
    }
    .form-panel.active {
      display: block;
    }
    .submit-btn {
      width: 100%;
      margin-top: 0.5rem;
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 0.7rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">oldpei<span>.site</span></div>
    <div>
      <a href="../index.html" class="nav-link">← 返回实验室</a>
    </div>
  </nav>

  <div class="container" style="max-width: 500px; margin-top: 2rem;">
    <h1 class="page-title" style="font-size: 1.8rem;">密码绝不同款注册局</h1>
    <p class="page-subtitle">全球唯一密码政策，保障您的账号绝对独特。</p>

    <div class="tab-container">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>

    <div id="messageBox"></div>

    <!-- 登录面板 -->
    <div id="loginPanel" class="form-panel active">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码">
      </div>
      <button class="submit-btn" id="loginBtn">登录</button>
    </div>

    <!-- 注册面板 -->
    <div id="registerPanel" class="form-panel">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" id="regUsername" class="form-input" placeholder="给自己起个名">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" id="regPassword" class="form-input" placeholder="请输入一个独特的密码">
      </div>
      <div class="rule-hint">
        <span>💡</span>
        <div>本站采用“一密一用”策略，您的密码必须全球唯一。若密码与他人重复，注册将被拒绝。</div>
      </div>
      <button class="submit-btn" id="registerBtn">立即注册</button>
    </div>
  </div>

  <!-- 广告轮播 -->
  <script src="../assets/ads.js"></script>
  <script src="../assets/utils.js"></script>
  <script src="../assets/ad-banner.js"></script>

  <script>
    // 预置用户数据
    const defaultUsers = [
      { username: '小王爱吃香菜', password: '123456' },
      { username: '秃头程序员', password: 'password' },
      { username: '深夜emo患者', password: 'abc123' },
      { username: '退堂鼓一级艺术家', password: 'qwerty' },
      { username: '起名困难户', password: 'admin' }
    ];

    // 初始化localStorage
    if (!localStorage.getItem('lab_users')) {
      localStorage.setItem('lab_users', JSON.stringify(defaultUsers));
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('lab_users')) || [];
    }

    function saveUser(user) {
      const users = getUsers();
      users.push(user);
      localStorage.setItem('lab_users', JSON.stringify(users));
    }

    function findUserByPassword(password) {
      return getUsers().find(u => u.password === password);
    }

    // 消息提示
    function showMessage(text, type) {
      const box = document.getElementById('messageBox');
      box.innerHTML = `<div class="message message-${type}">${text}</div>`;
    }

    // Tab切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const target = this.dataset.tab;
        document.getElementById('loginPanel').classList.toggle('active', target === 'login');
        document.getElementById('registerPanel').classList.toggle('active', target === 'register');
        document.getElementById('messageBox').innerHTML = '';
      });
    });

    // 注册逻辑：密码唯一性校验
    document.getElementById('registerBtn').addEventListener('click', () => {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      if (!username || !password) {
        showMessage('用户名和密码不能为空', 'error');
        return;
      }
      const existing = findUserByPassword(password);
      if (existing) {
        showMessage(`❌ 密码已被用户 <strong>${existing.username}</strong> 使用，请发挥你的创造力！`, 'error');
      } else {
        saveUser({ username, password });
        showMessage(`✅ 注册成功！欢迎你，${username}，你的密码独一无二！`, 'success');
        document.getElementById('regUsername').value = '';
        document.getElementById('regPassword').value = '';
      }
    });

    // 登录逻辑
    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const users = getUsers();
      const user = users.find(u => u.username === username && u.password === password);
      if (user) {
        showMessage(`🎉 登录成功！欢迎回来，${user.username}！`, 'success');
      } else {
        showMessage('用户名或密码错误，或者该账号根本不存在（去注册一个独特的密码吧！）', 'error');
      }
    });
  </script>
</body>
</html>
