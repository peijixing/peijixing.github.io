<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码绝不同款注册局 | 离谱发明实验室</title>
  <link rel="stylesheet" href="../assets/style.css">
<script type="module" src="../assets/firebase-init.js"></script>
  <style>
    .rule-hint { background-color: rgba(88,166,255,0.05); border-left: 3px solid var(--accent-blue); padding: 0.8rem 1rem; margin: 1rem 0; font-size: 0.9rem; display: flex; gap: 0.5rem; align-items: flex-start; border-radius: var(--radius); }
    .tab-container { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
    .tab-btn { background: none; border: none; color: var(--text-secondary); padding: 0.5rem 1.5rem; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: var(--font-sans); font-size: 1rem; }
    .tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
    .submit-btn { width: 100%; margin-top: 0.5rem; background-color: var(--accent-blue); color: #fff; border: none; padding: 0.7rem; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 1rem; }
    .conflict-card { background: var(--bg-secondary); border: 1px solid var(--accent-red); border-radius: var(--radius); padding: 1.5rem; margin-top: 1.5rem; text-align: center; box-shadow: 0 0 15px rgba(248,81,73,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(248,81,73,0.3); } 50% { box-shadow: 0 0 20px rgba(248,81,73,0.6); } 100% { box-shadow: 0 0 10px rgba(248,81,73,0.3); } }
    .conflict-card .card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .conflict-card .card-line { margin: 0.5rem 0; font-size: 1rem; color: var(--text-primary); }
    .conflict-card .card-line strong { color: var(--accent-yellow); }
    .conflict-card .card-footer-text { margin-top: 1rem; font-size: 0.8rem; color: var(--text-secondary); }
    .leaderboard { margin-top: 2rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.2rem; }
    .leaderboard h4 { margin-bottom: 0.8rem; font-size: 1rem; color: var(--accent-blue); }
    .leaderboard .stat { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .leaderboard ol { padding-left: 1.5rem; margin: 0.5rem 0 0; }
    .leaderboard ol li { font-size: 0.85rem; margin-bottom: 0.2rem; }
    .hall-of-shame { margin-top: 1.5rem; }
    .hall-of-shame table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .hall-of-shame th, .hall-of-shame td { padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    .hall-of-shame th { color: var(--accent-yellow); }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="logo">离谱发明实验室</span>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="../index.html" class="nav-link">← 返回实验室</a>
    </div>
  </nav>

  <div class="container" style="max-width: 500px; margin-top: 2rem;">
    <h1 class="page-title" style="font-size: 1.8rem;">密码绝不同款注册局</h1>
    <p class="page-subtitle">全球唯一密码政策，保障您的账号绝对独特。</p>

    <div class="tab-container">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>

    <div id="messageBox"></div>

    <div id="loginPanel" class="form-panel active">
      <div class="form-group"><label class="form-label">用户名</label><input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名（支持中文）"></div>
      <div class="form-group"><label class="form-label">密码</label><input type="password" id="loginPassword" class="form-input" placeholder="请输入密码"></div>
      <button class="submit-btn" id="loginBtn">登录</button>
    </div>

    <div id="registerPanel" class="form-panel">
      <div class="form-group"><label class="form-label">用户名</label><input type="text" id="regUsername" class="form-input" placeholder="给自己起个名（支持中文）"></div>
      <div class="form-group"><label class="form-label">密码</label><input type="password" id="regPassword" class="form-input" placeholder="请输入一个独特的密码"></div>
      <div class="rule-hint"><span>💡</span><div>本站采用“一密一用”策略，您的密码必须全球唯一。若密码与他人重复，注册将被拒绝。</div></div>
      <button class="submit-btn" id="registerBtn">立即注册</button>
    </div>

    <div class="leaderboard" id="leaderboard" style="display:none;">
      <h4>🏆 全球密码撞衫榜（仅登录用户可见）</h4>
      <div class="stat"><span>🔥 今日密码撞衫次数</span><span id="todayConflicts">0</span></div>
      <div><span>📋 近期撞衫密码 TOP 5</span><ol id="topPasswords"></ol></div>
      <div class="hall-of-shame"><span>👤 冲突用户花名册</span>
        <table><thead><tr><th>用户</th><th>密码</th><th>时间</th></tr></thead><tbody id="shameBody"></tbody></table>
      </div>
    </div>
  </div>

  <script src="../assets/ads.js"></script>
  <script src="../assets/utils.js"></script>
  <script src="../assets/ad-banner.js"></script>
  <script src="../assets/share-button.js"></script>
  <script src="../assets/stats.js"></script>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
      navLinks.querySelectorAll('.nav-link').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('open')));
    }

    const defaultUsers = [
      { username: '小王爱吃香菜', password: '123456' },
      { username: '秃头程序员', password: 'password' },
      { username: '深夜emo患者', password: 'abc123' },
      { username: '退堂鼓一级艺术家', password: 'qwerty' },
      { username: '起名困难户', password: 'admin' }
    ];
    if (!localStorage.getItem('lab_users')) localStorage.setItem('lab_users', JSON.stringify(defaultUsers));
    if (!localStorage.getItem('password_conflicts')) localStorage.setItem('password_conflicts', JSON.stringify([]));

    function getUsers() { return JSON.parse(localStorage.getItem('lab_users')) || []; }
    function saveUser(user) { const users = getUsers(); users.push(user); localStorage.setItem('lab_users', JSON.stringify(users)); }
    function findUserByPassword(password) { return getUsers().find(u => u.password === password); }

    async function logConflict(password, conflictUser) {
      const conflicts = JSON.parse(localStorage.getItem('password_conflicts') || '[]');
      conflicts.push({ password, conflictUser, timestamp: Date.now() });
      localStorage.setItem('password_conflicts', JSON.stringify(conflicts.filter(c => c.timestamp > Date.now() - 7*24*60*60*1000)));
      if (window.db) {
        try {
          const { addDoc, collection, serverTimestamp } = window.firestoreHelpers;
          await addDoc(collection(window.db, "conflicts"), { password, conflictUser, timestamp: serverTimestamp() });
        } catch(e) { console.warn('Firestore write failed', e); }
      }
      updateLocalLeaderboard();
    }

    function updateLocalLeaderboard() {
      const conflicts = JSON.parse(localStorage.getItem('password_conflicts') || '[]');
      const todayStart = new Date().setHours(0, 0, 0, 0);
      document.getElementById('todayConflicts').textContent = conflicts.filter(c => c.timestamp >= todayStart).length + ' 次';
      const freq = {};
      conflicts.forEach(c => freq[c.password] = (freq[c.password] || 0) + 1);
      const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const topList = document.getElementById('topPasswords');
      topList.innerHTML = sorted.length ? sorted.map(([p, c]) => `<li>${p} (${c}次)</li>`).join('') : '<li style="color:var(--text-secondary)">暂无数据</li>';
      const recent = [...conflicts].sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
      const shameBody = document.getElementById('shameBody');
      shameBody.innerHTML = recent.length ? recent.map(c => `<tr><td>${c.conflictUser}</td><td>${c.password}</td><td>${new Date(c.timestamp).toLocaleTimeString()}</td></tr>`).join('') : '<tr><td colspan="3" style="color:var(--text-secondary);">暂无花名册</td></tr>';
    }

    function startGlobalLeaderboard() {
      if (!window.db || !window.firestoreHelpers) { updateLocalLeaderboard(); return; }
      const { query, collection, orderBy, limit, onSnapshot } = window.firestoreHelpers;
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const q = query(collection(window.db, "conflicts"), orderBy("timestamp", "desc"), limit(200));
      onSnapshot(q, snapshot => {
        const conflicts = [];
        snapshot.forEach(doc => { const data = doc.data(); conflicts.push({ ...data, timestamp: data.timestamp ? data.timestamp.toDate().getTime() : 0 }); });
        document.getElementById('todayConflicts').textContent = conflicts.filter(c => c.timestamp >= todayStart.getTime()).length + ' 次';
        const freq = {};
        conflicts.forEach(c => freq[c.password] = (freq[c.password] || 0) + 1);
        const sorted = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0,5);
        document.getElementById('topPasswords').innerHTML = sorted.map(([p,c]) => `<li>${p} (${c}次)</li>`).join('');
        const recent = [...conflicts].sort((a,b) => b.timestamp - a.timestamp).slice(0,10);
        document.getElementById('shameBody').innerHTML = recent.map(c => `<tr><td>${c.conflictUser}</td><td>${c.password}</td><td>${new Date(c.timestamp).toLocaleTimeString()}</td></tr>`).join('');
      }, err => { console.warn('Firestore read failed', err); updateLocalLeaderboard(); });
    }

    function showConflictCard(conflictUser, password) {
      const now = new Date();
      const cardHTML = `<div class="conflict-card" id="conflictCard">
        <div class="card-icon">⚠️</div><div class="card-line"><strong>密码已被占用</strong></div>
        <div class="card-line">用户：<strong>${conflictUser}</strong></div>
        <div class="card-line">密码：<strong>${password}</strong></div>
        <div class="card-line">时间：${now.toLocaleString()}</div>
        <div class="card-line">来自：离谱发明实验室</div>
        <div class="card-footer-text">📸 截图分享，让大家看看是谁在用这个密码</div>
      </div>`;
      document.getElementById('messageBox').innerHTML = cardHTML;
    }

    function showMessage(text, type) { document.getElementById('messageBox').innerHTML = `<div class="message message-${type}">${text}</div>`; }
    function hideLeaderboard() { document.getElementById('leaderboard').style.display = 'none'; }
    function showLeaderboard() { document.getElementById('leaderboard').style.display = 'block'; updateLocalLeaderboard(); startGlobalLeaderboard(); }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('loginPanel').classList.toggle('active', this.dataset.tab === 'login');
        document.getElementById('registerPanel').classList.toggle('active', this.dataset.tab === 'register');
        document.getElementById('messageBox').innerHTML = '';
        hideLeaderboard();
      });
    });

    document.getElementById('registerBtn').addEventListener('click', () => {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      if (!username || !password) { showMessage('用户名和密码不能为空', 'error'); return; }
      const existing = findUserByPassword(password);
      if (existing) {
        logConflict(password, existing.username);
        showConflictCard(existing.username, password);
        // 冲突时计数
        if (window.incrementStat) window.incrementStat('password_unique');
      } else {
        saveUser({ username, password });
        showMessage(`✅ 注册成功！欢迎你，${username}，你的密码独一无二！`, 'success');
        document.getElementById('regUsername').value = '';
        document.getElementById('regPassword').value = '';
        hideLeaderboard();
      }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const user = getUsers().find(u => u.username === username && u.password === password);
      if (user) { showMessage(`🎉 登录成功！欢迎回来，${user.username}！`, 'success'); showLeaderboard(); }
      else { showMessage('用户名或密码错误，或者该账号根本不存在', 'error'); hideLeaderboard(); }
    });

    hideLeaderboard();
  </script>
</body>
</html>
