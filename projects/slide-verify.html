<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>捉迷藏滑块验证 | 离谱发明实验室</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js';
    import { getFirestore, doc, setDoc, increment } from 'https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js';
    const firebaseConfig = {
      apiKey: "AIzaSyCrag9I2Jhy7VtHCabGWCw4Pt6AoJ0Hgjo",
      authDomain: "absurd-lab.firebaseapp.com",
      projectId: "absurd-lab",
      storageBucket: "absurd-lab.firebasestorage.app",
      messagingSenderId: "989176389764",
      appId: "1:989176389764:web:f656f6db4e31de39bc22d1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.firestoreHelpers = { doc, setDoc, increment };
  </script>
  <style>
    .login-box { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 2rem; max-width: 400px; margin: 2rem auto; }
    .submit-btn { width: 100%; margin-top: 1rem; }
    .verify-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
    .verify-overlay.active { display: flex; }
    .verify-box { position: absolute; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; width: 90%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); user-select: none; -webkit-user-select: none; touch-action: none; cursor: default; transition: none; }
    .verify-title { font-weight: 600; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; padding: 0 5px; line-height: 1; }
    .close-btn:hover { color: var(--accent-red); }
    .slider-track { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 20px; height: 42px; position: relative; overflow: hidden; margin: 1rem 0 0.5rem; }
    .slider-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); border-radius: 20px; transition: none; }
    .slider-btn { position: absolute; left: 0; top: 0; width: 50px; height: 100%; background: var(--accent-blue); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.3); touch-action: none; z-index: 2; }
    .verify-hint { text-align: center; color: var(--text-secondary); font-size: 0.85rem; }
    .verify-status { text-align: center; margin-top: 0.5rem; font-size: 0.9rem; color: var(--accent-red); min-height: 1.5em; }
    .give-up-btn { display: block; margin: 0.8rem auto 0; padding: 0.3rem 1.2rem; background: transparent; border: 1px solid var(--text-secondary); color: var(--text-secondary); border-radius: var(--radius); cursor: pointer; font-size: 0.8rem; }
    .give-up-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="logo">离谱发明实验室</span>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="../index.html" class="nav-link">← 返回实验室</a>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">🎯 捉迷藏滑块验证</h1>
    <p class="page-subtitle">登录需要先通过人类验证，但滑块好像不太听话。</p>

    <div class="login-box">
      <div id="loginMsg"></div>
      <div class="form-group"><label class="form-label">用户名</label><input type="text" id="username" class="form-input" placeholder="admin"></div>
      <div class="form-group"><label class="form-label">密码</label><input type="password" id="password" class="form-input" placeholder="••••••"></div>
      <button class="btn submit-btn" id="loginBtn">登录</button>
    </div>
  </div>

  <div class="verify-overlay" id="verifyOverlay">
    <div class="verify-box" id="verifyBox">
      <div class="verify-title"><span>🔒 安全验证</span><button class="close-btn" id="closeVerifyBtn">✕</button></div>
      <p style="margin-bottom: 0.5rem; color: var(--text-secondary);">请按住滑块，拖动到最右边</p>
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-btn" id="sliderBtn">→</div>
      </div>
      <div class="verify-hint">拖到30%后弹窗会逃跑，快完成时还会自动重置</div>
      <div class="verify-status" id="verifyStatus"></div>
      <button class="give-up-btn" id="giveUpBtn">放弃验证（直接获取彩蛋）</button>
    </div>
  </div>

  <script src="../assets/ads.js"></script>
  <script src="../assets/utils.js"></script>
  <script src="../assets/ad-banner.js"></script>
  <script src="../assets/stats.js"></script>
  <script src="../assets/share-button.js"></script>

  <script>
    // 菜单、登录等逻辑与之前相同，此处保持全部交互
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
      navLinks.querySelectorAll('.nav-link').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('open')));
    }

    let verifyFailCount = 0;
    const loginBtn = document.getElementById('loginBtn'), loginMsg = document.getElementById('loginMsg');

    loginBtn.addEventListener('click', () => {
      const username = document.getElementById('username').value.trim(), password = document.getElementById('password').value.trim();
      if (!username || !password) { loginMsg.innerHTML = '<div class="message message-error">请输入用户名和密码</div>'; return; }
      showVerify();
    });

    const overlay = document.getElementById('verifyOverlay'), verifyBox = document.getElementById('verifyBox'), closeVerifyBtn = document.getElementById('closeVerifyBtn');
    const sliderBtn = document.getElementById('sliderBtn'), sliderFill = document.getElementById('sliderFill'), sliderTrack = document.getElementById('sliderTrack');
    const verifyStatus = document.getElementById('verifyStatus'), giveUpBtn = document.getElementById('giveUpBtn');

    let isDragging = false, startDragX = 0, startDragY = 0, initialSliderLeft = 0, initialBoxLeft = 0, initialBoxTop = 0, boxMoved = false;

    function showVerify() {
      verifyBox.style.left = '50%'; verifyBox.style.top = '50%'; verifyBox.style.transform = 'translate(-50%, -50%)'; verifyBox.style.pointerEvents = 'auto';
      sliderBtn.style.left = '0px'; sliderFill.style.width = '0%'; verifyStatus.textContent = ''; overlay.classList.add('active'); verifyFailCount = 0;
      sliderTrack.style.display = 'block'; verifyBox.querySelector('p').style.display = 'block'; document.querySelector('.verify-hint').style.display = 'block'; giveUpBtn.style.display = 'block';
    }
    function hideVerify() { overlay.classList.remove('active'); }
    closeVerifyBtn.addEventListener('click', e => { e.stopPropagation(); hideVerify(); });
    giveUpBtn.addEventListener('click', () => { verifyStatus.innerHTML = '你放弃了验证，AI 判定已生效。'; showPermanentAd(); });

    function getProgress() { const trackWidth = sliderTrack.clientWidth - sliderBtn.offsetWidth; const left = parseFloat(sliderBtn.style.left) || 0; return (left / trackWidth) * 100; }
    function setSliderLeft(px) { const trackWidth = sliderTrack.clientWidth - sliderBtn.offsetWidth; const clamped = Math.min(trackWidth, Math.max(0, px)); sliderBtn.style.left = clamped + 'px'; sliderFill.style.width = (clamped / trackWidth * 100) + '%'; }

    function onDragStart(e) {
      if (e.target !== sliderBtn) return; e.preventDefault(); isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY;
      startDragX = clientX; startDragY = clientY; initialSliderLeft = parseFloat(sliderBtn.style.left) || 0;
      const rect = verifyBox.getBoundingClientRect(); initialBoxLeft = rect.left; initialBoxTop = rect.top;
      verifyBox.style.transform = 'none'; verifyBox.style.left = rect.left + 'px'; verifyBox.style.top = rect.top + 'px'; boxMoved = false;
    }

    function onDragMove(e) {
      if (!isDragging) return; e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = clientX - startDragX, dy = clientY - startDragY;
      const trackWidth = sliderTrack.clientWidth - sliderBtn.offsetWidth;
      let newLeft = initialSliderLeft + dx; newLeft = Math.min(trackWidth, Math.max(0, newLeft));
      sliderBtn.style.left = newLeft + 'px'; const progress = (newLeft / trackWidth) * 100; sliderFill.style.width = progress + '%';

      if (progress >= 30) {
        let moveX = dx, moveY = dy; const speedMultiplier = 1 + (progress - 30) / 50; moveX *= speedMultiplier; moveY *= speedMultiplier;
        let newBoxX = initialBoxLeft + moveX, newBoxY = initialBoxTop + moveY;
        const boxW = verifyBox.offsetWidth, boxH = verifyBox.offsetHeight, screenW = window.innerWidth, screenH = window.innerHeight, margin = 20;
        if (newBoxX < margin) { newBoxX = margin; boxMoved = true; initialBoxLeft = newBoxX; initialBoxTop = newBoxY; startDragX = clientX; startDragY = clientY; initialSliderLeft = newLeft; }
        else if (newBoxX + boxW > screenW - margin) { newBoxX = screenW - boxW - margin; boxMoved = true; initialBoxLeft = newBoxX; initialBoxTop = newBoxY; startDragX = clientX; startDragY = clientY; initialSliderLeft = newLeft; }
        if (newBoxY < margin) { newBoxY = margin; boxMoved = true; initialBoxLeft = newBoxX; initialBoxTop = newBoxY; startDragX = clientX; startDragY = clientY; initialSliderLeft = newLeft; }
        else if (newBoxY + boxH > screenH - margin) { newBoxY = screenH - boxH - margin; boxMoved = true; initialBoxLeft = newBoxX; initialBoxTop = newBoxY; startDragX = clientX; startDragY = clientY; initialSliderLeft = newLeft; }
        verifyBox.style.left = newBoxX + 'px'; verifyBox.style.top = newBoxY + 'px';
      }

      if (progress > 92) {
        isDragging = false; verifyStatus.textContent = '即将完成…但验证好像又跑了！'; setSliderLeft(0);
        verifyBox.style.left = Math.random() * (window.innerWidth - verifyBox.offsetWidth) + 'px';
        verifyBox.style.top = Math.random() * (window.innerHeight - verifyBox.offsetHeight) + 'px';
        verifyFailCount++;
        if (verifyFailCount >= 3) { verifyStatus.innerHTML = '验证失败次数过多。'; showPermanentAd(); }
      }
    }

    function onDragEnd() {
      if (!isDragging) return; isDragging = false;
      const progress = getProgress();
      if (progress < 92 && verifyFailCount < 3) {
        verifyFailCount++;
        if (verifyFailCount >= 3) { verifyStatus.innerHTML = '验证失败次数过多。'; showPermanentAd(); }
        else { verifyStatus.textContent = '验证失败，请重试！（第' + verifyFailCount + '次）'; setSliderLeft(0); }
      }
    }

    sliderBtn.addEventListener('mousedown', onDragStart);
    sliderBtn.addEventListener('touchstart', onDragStart, { passive: false });
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);

    function showPermanentAd() {
      verifyBox.style.pointerEvents = 'none';
      if (typeof AD_LIST !== 'undefined' && AD_LIST.length > 0) {
        const randomAd = AD_LIST[Math.floor(Math.random() * AD_LIST.length)];
        const adDiv = document.createElement('div'); adDiv.className = 'message'; adDiv.style.cssText = 'background-color: rgba(88,166,255,0.1); border-color: var(--accent-blue); margin-top: 1rem; pointer-events: auto;';
        adDiv.innerHTML = `<strong>🎁 AI专属隐藏资源：</strong> ${randomAd.title}<br><button class="btn btn-sm" style="margin-top: 0.5rem;" id="copyAdBtn">复制口令</button>`;
        verifyBox.appendChild(adDiv);
        document.getElementById('copyAdBtn').addEventListener('click', () => copyToClipboard(randomAd.code, s => alert(s ? '已复制，请到对应的 App 查看' : '复制失败')));
      }
      sliderTrack.style.display = 'none'; verifyBox.querySelector('p').style.display = 'none'; document.querySelector('.verify-hint').style.display = 'none'; giveUpBtn.style.display = 'none';
    }

    overlay.addEventListener('click', e => { if (e.target === overlay) hideVerify(); });

    window.addEventListener('DOMContentLoaded', () => {
      if (window.incrementStat) window.incrementStat('slide_verify');
    });
  </script>
</body>
</html>
